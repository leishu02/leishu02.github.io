<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ink Landscape — Bamboo Gorge</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #eef2f2; }
  canvas { display: block; width: 100vw; height: 100vh; }

  /* rice-paper grain, very faint */
  .grain {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    opacity: .30; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='0.35'/></svg>");
  }

  .hint {
    position: fixed; z-index: 3; pointer-events: none;
    bottom: 26px; right: 34px;
    font: 300 10px/1 Georgia, serif;
    color: rgba(38, 58, 70, .30);
    letter-spacing: .26em;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div class="hint">drag to look &middot; scroll to zoom</div>
<div class="grain"></div>

<script type="importmap">
{ "imports": { "three": "./assets/js/three.module.min.js" } }
</script>

<script type="module">
import { mountInkLandscape } from './assets/js/ink-landscape.js?v=20260923k';
mountInkLandscape({ canvas: document.getElementById('scene'), interactive: true });
</script>
</body>
</html>
